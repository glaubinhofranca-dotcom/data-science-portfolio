version: '3.8'

services:
  # ----------------------------
  # 1. MESSAGE BROKER (Confluent)
  # ----------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: stock_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stock_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ----------------------------
  # 2. PROCESSING ENGINE (Apache Official Image)
  # ----------------------------
  spark-master:
    # Trocando Bitnami por Apache Oficial
    image: apache/spark:3.5.0
    container_name: stock_spark_master
    user: root # Necessário para permissões de escrita
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: apache/spark:3.5.0
    container_name: stock_spark_worker
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=1G
    depends_on:
      - spark-master

  # ----------------------------
  # 3. STORAGE (Postgres)
  # ----------------------------
  postgres:
    image: postgres:13
    container_name: stock_postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=stock_market
    ports:
      - "5436:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d

  # ----------------------------
  # 4. VISUALIZATION (Grafana)
  # ----------------------------
  grafana:
    image: grafana/grafana:10.2.3
    container_name: stock_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - postgres